<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Galleria astratto v2</title>
<style>
 body{font:14px system-ui,sans-serif;margin:16px;background:#f6f6f4;color:#1b1b1b}
 .item{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin:0 0 12px;max-width:440px}
 .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
 .q{width:60px;height:60px;border:2px dashed #999;display:grid;place-items:center;font-weight:700}
 .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
 .opt{display:grid;justify-items:center;gap:2px;border:1px solid #ccc;border-radius:6px;padding:3px}
 .opt.ok{border:3px solid #1a7f37}
 .meta{font-size:12px;color:#555;margin:4px 0}
 p{margin:6px 0 0;font-size:11.5px;line-height:1.35}
</style></head><body>
<!-- Uso: ?seed=1 (default), &n=12, &lv=2|3 (default alterna), &blind=1 (nasconde chiave e spiegazione), &size=64 -->
<script src="../../js/gen-astratto2.js"></script>
<script>
const g = App.gen.astratto2;
const qs = new URLSearchParams(location.search);
const seed = Number(qs.get('seed') || 1), n = Number(qs.get('n') || 12), size = Number(qs.get('size') || 64);
const blind = qs.get('blind') === '1', lvq = qs.get('lv');
for (let i = 0; i < n; i++) {
  const lv = lvq ? Number(lvq) : 2 + (i % 2);
  const q = g.make(seed * 1000 + i, lv);
  const box = document.createElement('div'); box.className = 'item';
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.textContent = blind ? q.id : `${q.id} · ${q.ruleParams.map((r) => r.name).join(' + ')} · chiave ${q.correct[0]}`;
  const row = document.createElement('div'); row.className = 'row';
  q.series.forEach((sp, k) => row.append(g.draw(sp, { size, label: `Figura ${k + 1}` })));
  const qm = document.createElement('span'); qm.className = 'q'; qm.textContent = '?'; row.append(qm);
  const opts = document.createElement('div'); opts.className = 'opts';
  q.options.forEach((o) => {
    const c = document.createElement('div'); c.className = 'opt' + (!blind && o.letter === q.correct[0] ? ' ok' : '');
    const l = document.createElement('b'); l.textContent = o.letter;
    c.append(l, g.draw(o.fig, { size, label: `Opzione ${o.letter}` })); opts.append(c);
  });
  box.append(meta, row, opts);
  if (!blind) { const ex = document.createElement('p'); ex.textContent = q.explanation; box.append(ex); }
  document.body.append(box);
}
</script></body></html>
